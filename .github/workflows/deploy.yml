name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            echo "Entrando no projeto..."
            cd /opt/docker/projects/focuslife

            echo "Removendo .env antigo (se existir)..."
            rm -f .env

            echo "Criando novo arquivo .env com as variáveis..."
            cat > .env <<EOF
            POSTGRES_DB=focuslifehub
            POSTGRES_USER=focuslife
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/focuslifehub
            SPRING_DATASOURCE_USERNAME=focuslife
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ALLOWED_ORIGINS=http://localhost:3000,https://focus.lzguimaraes.com.br
            FRONTEND_PORT=3000
            BACKEND_PORT=8080
            POSTGRES_PORT=5432
            EOF

            echo "Atualizando repositório..."
            git fetch origin
            git reset --hard origin/main

            echo "Parando containers antigos..."
            docker compose down

            echo "Construindo novas imagens..."
            docker compose up -d --build

            echo "Limpando imagens antigas..."
            docker image prune -af

            echo "Deploy concluído!"
