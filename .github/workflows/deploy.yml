name: Deploy VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets obrigatórios
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_FROM: ${{ secrets.SPRING_MAIL_FROM }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
          APP_BACKEND_URL: ${{ secrets.APP_BACKEND_URL }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
        run: |
          set -euo pipefail
          echo "==> Validando secrets obrigatórios..."
          required=(VPS_HOST VPS_USER SSH_PRIVATE_KEY SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS SPRING_MAIL_USERNAME SPRING_MAIL_PASSWORD SPRING_MAIL_FROM APP_FRONTEND_URL APP_BACKEND_URL)
          missing=0
          for var in "${required[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "  MISSING: $var"
              missing=1
            else
              echo "  SET: $var"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ERROR: Um ou mais secrets obrigatórios estão faltando. Corrija antes de prosseguir."
            exit 1
          fi
          echo "==> Verificando formatação de CORS_ALLOWED_ORIGINS..."
          if [[ -z "$CORS_ALLOWED_ORIGINS" ]]; then
            echo "  ERROR: CORS_ALLOWED_ORIGINS está vazio"
            exit 1
          fi
          if [[ "$CORS_ALLOWED_ORIGINS" != http* ]]; then
            echo "  ERROR: CORS_ALLOWED_ORIGINS está malformado ('$CORS_ALLOWED_ORIGINS'). Use apenas a lista de origens, ex.: http://localhost:3000,https://focus.lzguimaraes.com.br"
            exit 1
          fi
          echo "  CORS_ALLOWED_ORIGINS formatação ok"
          echo "==> Todos os secrets estão corretos. Prosseguindo com o deploy."

      - name: Diagnosticar conectividade com a VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          PORT=${VPS_PORT:-22}
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${PORT}"; then
            echo "Porta ${PORT} acessível"
          else
            echo "Porta ${PORT} bloqueada (timeout) - verificar firewall do provedor"
            exit 1
          fi

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          script: |
            set -e
            echo "Entrando no projeto..."
            cd /opt/docker/projects/focuslife || mkdir -p /opt/docker/projects/focuslife && cd /opt/docker/projects/focuslife

            echo "Removendo .env antigo (se existir)..."
            rm -f .env

            echo "Criando novo arquivo .env com as variáveis..."
            cat > .env <<EOF
SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
JWT_SECRET=${{ secrets.JWT_SECRET }}
CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
SPRING_MAIL_FROM=${{ secrets.SPRING_MAIL_FROM }}
APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
APP_BACKEND_URL=${{ secrets.APP_BACKEND_URL }}
FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
BACKEND_PORT=${{ secrets.BACKEND_PORT }}
EOF

            echo "Atualizando repositório..."
            if [ -d .git ]; then
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            echo "Parando containers antigos..."
            docker compose down || true

            echo "Construindo novas imagens..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "Limpando imagens antigas..."
            docker image prune -af || true

            echo "Deploy concluído!"
