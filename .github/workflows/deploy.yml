name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          script: |
            set -e
            echo "Running deploy on ${HOST:-remote}..."
            # adapt path to your deployment location
            DEPLOY_DIR=/home/${{ secrets.VPS_USER }}/apps/focuslife
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # Ensure repository exists and is up-to-date
            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }} .
            fi
            # Pull images and restart according to production compose
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Deploy finished."
name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validar secrets obrigatórios
        shell: bash
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_FROM: ${{ secrets.SPRING_MAIL_FROM }}
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
          APP_BACKEND_URL: ${{ secrets.APP_BACKEND_URL }}
        run: |
          set -euo pipefail
          echo "==> Validando secrets obrigatórios..."
          for var in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS SPRING_MAIL_USERNAME SPRING_MAIL_PASSWORD SPRING_MAIL_FROM APP_FRONTEND_URL APP_BACKEND_URL; do
            if [ -z "${!var}" ]; then
              echo "  MISSING: $var"
            else
              echo "  SET: $var"
            fi
          done
          echo "==> Resultado da validação de variáveis de ambiente acima."
          echo "==> Verificando formatação de CORS_ALLOWED_ORIGINS..."
          if [[ -z "$CORS_ALLOWED_ORIGINS" ]]; then
            echo "  ERROR: CORS_ALLOWED_ORIGINS está vazio"
            exit 1
          fi
          if [[ "$CORS_ALLOWED_ORIGINS" != http* ]]; then
            echo "  ERROR: CORS_ALLOWED_ORIGINS está malformado ('$CORS_ALLOWED_ORIGINS'). Use apenas a lista de origens, ex.: http://localhost:3000,https://focus.lzguimaraes.com.br"
            exit 1
          fi
          echo "  CORS_ALLOWED_ORIGINS formatação ok"
          echo "==> Todos os secrets estão corretos. Prosseguindo com o deploy."

      - name: Diagnosticar conectividade com a VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/22"; then
            echo "Porta 22 acessível"
          else
            echo "Porta 22 bloqueada (timeout) - verificar firewall do provedor"
            exit 1
          fi

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            echo "Entrando no projeto..."
            cd /opt/docker/projects/focuslife

            echo "Removendo .env antigo (se existir)..."
            rm -f .env

            echo "Criando novo arquivo .env com as variáveis..."
            cat > .env <<EOF
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
            SPRING_MAIL_FROM=${{ secrets.SPRING_MAIL_FROM }}
            APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
            APP_BACKEND_URL=${{ secrets.APP_BACKEND_URL }}
            FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            EOF

            echo "Atualizando repositório..."
            git fetch origin
            git reset --hard origin/main

            echo "Parando containers antigos..."
            docker compose down

            echo "Construindo novas imagens..."
            docker compose up -d --build

            echo "Limpando imagens antigas..."
            docker image prune -af

            echo "Deploy concluído!"
