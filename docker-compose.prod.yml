services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: focuslife
      POSTGRES_USER: focuslife
      POSTGRES_PASSWORD: focuslifepw
    volumes:
      - focuslife_pgdata:/var/lib/postgresql/data
    networks:
      - focuslife-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuslife -d focuslife"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    env_file:
      - .env.production
    environment:
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - JWT_SECRET
      - CORS_ALLOWED_ORIGINS
      - SPRING_MAIL_USERNAME
      - SPRING_MAIL_PASSWORD
      - SPRING_MAIL_FROM
      - APP_FRONTEND_URL
      - APP_BACKEND_URL
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backend.rule=Host(`apifocus.lzguimaraes.com.br`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - focuslife-internal

  frontend:
    build: ./frontend
    env_file:
      - .env.production
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.rule=Host(`focus.lzguimaraes.com.br`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - proxy

networks:
  proxy:
    external: true
  focuslife-internal:

volumes:
  focuslife_pgdata:
